<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Five fun places to visit in the US</title>
    <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #442a9b;
      background: linear-gradient(180deg,rgba(68, 42, 155, 1) 0%, rgba(199, 87, 165, 1) 50%, rgba(237, 196, 83, 1) 100%);
      padding: 15px;
      border: 2px solid #ee8f01;
      border-radius: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      min-height: 100vh;
    }

    h1, h2 {
      font-size: 3vh;
      padding: 2vh;
    }

    h2 {
      border-bottom: 2px solid #25053a;
      margin-bottom: 10px;
    }

    /* Grid container */
    .grid-wrapper {
      display: grid;
      grid-gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax (250px, 1fr));
      grid-auto-rows: minmax(250px, auto);
      grid-auto-flow: dense;
    }

    /* Grid item spans */
    .wide{
      grid-column: span 2;
    }
    .tall{
      grid-row: span 2;
    }
    .big{
      grid-column: span 2;
      grid-row: span 2;
    }




    /* Each figure is a grid item */
    figure {
      margin: 0;
      border-radius: 5px;
      overflow: hidden;
      border: 2px solid #190329;
      background-color: #2a1f46;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    figure img {
      width: 100%;
      height: auto;
      object-fit: cover;
      flex-grow: 1;
      display: block;
      border-bottom: 1px solid #190329;
    }

    figcaption {
      padding: 8px 10px;
      background-color: #200b30;
      color: white;
      font-size: 2.5vh;
      text-align: center;
      flex-shrink: 0;
    }
    </style>
</head>
<body>

  <header>
    <h1>A top 5 list of places to visit in the US according to Travel Advisor</h1>
    <h2>What are your top 5?</h2>
  </header>

  <main>
    <section class="grid-wrapper">
      <figure class="big">
        <img src="images/boat.jpg" alt="A boat scene" />
        <figcaption>Chicago</figcaption>
      </figure>

      <figure class="tall">
        <img src="images/brazil.jpeg" alt="Rio de Janeiro"/>
         <figcaption>Rio de Janeiro</figcaption>

      </figure class="tall">
      <figure class="">
        <img src="images/mexico-city.jpeg" alt="Mexico City"/>
          <figcaption>Mexico City</figcaption>
      </figure>

      <figure class="tall">
        <img src="images/san-diego.jpg"  alt="San Diego"/>
          <figcaption>San Diego </figcaption>
      </figure>

      <figure class="wide">
        <img src="images/winter.jpg" alt="New York Winter"  />
        <figcaption>Central Park</figcaption>
      </figure>
