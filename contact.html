<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <img src="JCCClogo.jpg" alt="JCCC Logo">
            <h2>Contact Us</h2>
            <p>We'd love to hear from you! Please fill out the form below.</p>
        </header>
        <main>
            <form action="https://webdevbasics.net/scripts/demo.php" method="post">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" maxlength="30" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" maxlength="30" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div> 
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required> 
                </div>
                <div class="form-group">
                    <label>How would you prefer we contact you?</label>
                    <div class="contact-options">
                        <div class="radio-option">
                            <input type="radio" id="contactEmail" name="contactPreference" value="Email" required>
                            <label for="contactEmail">Email</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="contactPhone" name="contactPreference" value="Phone" required>
                            <label for="contactPhone">Phone</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="contactNoPreference" name="contactPreference" value="No Preference" required>
                            <label for="contactNoPreference">No Preference</label>
                        </div>
                    </div>
                </div>
            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
            </form>
        </main>
    </div>
<footer><p>&copy; 2026 JCCC. All rights reserved.</p></footer>
</body>

</html>
